name: CI - Combined build and analysis workflow

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
    analyze-and-build:
      name: Analyze (${{ matrix.language }})
      runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
      defaults:
        run:
          working-directory: Globomantics.API
      permissions:
        # required for all workflows
        security-events: write

        # required to fetch internal or private CodeQL packs
        packages: read

        # only required for workflows in private repositories
        actions: read
        contents: read

      strategy:
        fail-fast: true
        matrix:
          include:
          - language: actions
            build-mode: none
            queries: ""
          - language: csharp
            build-mode: none
            queries: security-and-quality
      steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: ${{ matrix.queries }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore Globomantics.API.slnx

      - name: Build
        run: dotnet build Globomantics.API.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test Globomantics.API.slnx --configuration Release --no-build

      - name: Run Stryker
        run: dotnet stryker --threshold-low 80 --break-at 80
        working-directory: Globomantics.API.Tests

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{matrix.language}}"