name: CI – Simple Threat Mitigation Demo

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Globomantics.API
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Globomantics.API.sln

      # ---------------------------------------------------------------
      # Mitigation for the single threat in the threat model:
      # Fail the build if we find code that concatenates user input
      # into a query-like string.
      # ---------------------------------------------------------------
      - name: Check for unsafe input handling
        run: |
          if grep -rE "LIKE '%\" \+ .* \+ \"%'" --include='*.cs' Globomantics.API/ ; then
            echo "Unsafe pattern detected: user input concatenated into a query string"
            exit 1
          fi
          echo "No unsafe patterns found"

      - name: Build
        run: dotnet build Globomantics.API.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Globomantics.API.sln --configuration Release --no-build --verbosity normal
